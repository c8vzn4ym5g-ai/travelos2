name: Cloudflare recovery
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture one bounded runtime failure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          timeout 15s pnpm exec wrangler tail travelos2 --format=json > /tmp/travelos-tail.json 2>&1 &
          trace_pid=$!
          sleep 4
          curl -s --max-time 8 https://travelos2.chao-jason.workers.dev/family -o /dev/null || true
          wait "$trace_pid" || true
          cat /tmp/travelos-tail.json
      - name: Restore verified original deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler rollback 1e68e797-803d-436b-b2c6-1e344e68086a --name travelos2 --yes --message "Restore original working release after failed minimal acceptance"
